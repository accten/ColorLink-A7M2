name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design-preview.html'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - '.vscode/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-v2-${{ github.ref }}
  # 构建任务排队而不是互相取消：连续提交时只取消上一次是反效果
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: '1'
      # Skia / Reanimated 会吃内存，给 Gradle 多留一点
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像已预装 Android SDK 与 cmdline-tools，但 sdkmanager 不一定在 PATH 上。
      # 不要用 android-actions/setup-android：它内部执行 `sdkmanager tools`，
      # 新版本 cmdline-tools 已经没有 `tools` 包，会直接把 job 打挂。
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK_BIN=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -n1)
          if [ -z "$SDK_BIN" ]; then
            echo "::error::cmdline-tools not found under $ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "sdkmanager dir: $SDK_BIN"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          export PATH="$SDK_BIN:$PATH"
          sdkmanager --version
          java -version

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # RN 0.8x 的原生模块（reanimated/worklets/skia）需要 NDK + CMake。
      # 预装几个常见版本；如果 RN 模板要求别的版本，AGP 会按 ndkVersion 自行补装。
      - name: Install NDK and CMake
        run: |
          for v in "27.1.12297006" "28.0.13004108"; do
            sdkmanager --install "ndk;$v" > /dev/null 2>&1 || true
          done
          sdkmanager --install "cmake;3.22.1" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Static quality gate
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Generate native project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK (JS bundled, debug-signed)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp -v {} out/ \;
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colorlink-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colorlink-build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
