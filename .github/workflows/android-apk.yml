name: Android APK

on:
  push:
    branches: [main]
    # 推 v* tag 时自动发一个 GitHub Release，并把 APK 挂上去
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design-preview.html'
      - 'luts/**'
      - 'scripts/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - '.vscode/**'
  pull_request:
  workflow_dispatch:

permissions:
  # 创建 Release 需要写权限；其余步骤只用读
  contents: write

concurrency:
  group: apk-v2-${{ github.ref }}
  # 构建任务排队而不是互相取消：连续提交时只取消上一次是反效果
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Build APK
    # ubuntu-26.04 镜像上出现过 runner 在原生编译途中被回收（shutdown signal），
    # 22.04 是 Android 构建验证最充分的镜像。
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      CI: '1'
      # Skia / Reanimated 会吃内存，给 Gradle 多留一点
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像已预装 Android SDK 与 cmdline-tools，但 sdkmanager 不一定在 PATH 上。
      # 不要用 android-actions/setup-android：它内部执行 `sdkmanager tools`，
      # 新版本 cmdline-tools 已经没有 `tools` 包，会直接把 job 打挂。
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK_BIN=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -n1)
          if [ -z "$SDK_BIN" ]; then
            echo "::error::cmdline-tools not found under $ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "sdkmanager dir: $SDK_BIN"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          export PATH="$SDK_BIN:$PATH"
          sdkmanager --version
          java -version

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # RN 0.8x 的原生模块（reanimated/worklets/skia）需要 NDK + CMake。
      # 预装几个常见版本；如果 RN 模板要求别的版本，AGP 会按 ndkVersion 自行补装。
      - name: Install NDK and CMake
        run: |
          for v in "27.1.12297006" "28.0.13004108"; do
            sdkmanager --install "ndk;$v" > /dev/null 2>&1 || true
          done
          sdkmanager --install "cmake;3.22.1" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      # 私有仓库的 hosted runner 只有 2 核 / 7GB 内存 / 14GB 磁盘，
      # RN 原生构建（Skia + reanimated + Hermes + NDK）很容易把它打死：
      # 症状是 "hosted runner lost communication with the server"。
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* /opt/ghc \
                      /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Static quality gate
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Generate native project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Kotlin 单测：属性数组 / 对象载荷 / 曝光解码都是纯逻辑，不依赖相机或 USB。
      # 用聚合任务 `test`（各变体的 test*UnitTest 名字随 AGP 版本变，`test` 一直存在）。
      - name: Native unit tests (sony-camera)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :expo-sony-camera:test --no-daemon --stacktrace --max-workers=1 \
            -PreactNativeArchitectures=arm64-v8a \
            -Porg.gradle.parallel=false \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Build release APK (JS bundled, debug-signed)
        run: |
          cd android
          chmod +x gradlew
          # 只编 arm64-v8a：4 个 ABI 同时编 Skia/Reanimated 的 C++ 会打爆
          # runner 内存（表现为 exit 143 / SIGTERM，无任何 Gradle 报错）。
          # 自测 APK 也关掉 R8，省内存也省时间。
          free -h || true
          nproc || true
          ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=1 \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Porg.gradle.parallel=false \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp -v {} out/ \;
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colorlink-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      # 只有推 tag 才发版：main 上的普通推送仍然只产出 artifact，
      # 避免把每次提交都变成"发行版"。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: ColorLink ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装

            1. 下载下面的 `app-release.apk`
            2. 手机上打开安装（首次需允许「安装未知来源应用」）
            3. 或者用 `adb install -r app-release.apk`

            ## 这一版有什么

            - **真机 USB 联机**：ILCE-7M2 实测可用（PTP2），联机状态、机型、远程快门
            - **实时取景**：走 Sony 的虚拟取景句柄，实测约 10fps
            - **手动调色**：12 项参数、10 个预设、3D LUT、AI 一句话调色；支持撤销/重做、按组重置、亮度直方图
            - **导出**：尺寸可选「原图」、质量可到 100；没做调色时会直接复制原图字节（不重编码）

            ## 已知限制

            - A7M2 在「PC 遥控」模式下**不通过 PTP 回传照片**：快门能拍、照片留在相机卡里，
              App 会明确提示（取景与远程快门可用）
            - 只含 `arm64-v8a`；用 Android 调试证书签名，适合自测，不能上架
            - 内置 JS bundle，安装后不依赖电脑；首次启动会进入演示模式
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colorlink-build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

